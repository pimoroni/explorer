name: PicoVector

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  build:
    name: MicroPython explorer-picovector
    runs-on: ubuntu-24.04
    continue-on-error: true

    env:
      CI_RELEASE_FILENAME: explorer-picovector-${{ github.event.release.tag_name || github.sha }}-micropython
      CI_PROJECT_ROOT: ${{ github.workspace }}/src-${{ github.sha }}
      CI_BUILD_ROOT: ${{ github.workspace }}
      CI_USE_ENV: 1
      TAG_OR_SHA: ${{ github.event.release.tag_name || github.sha }}

    steps:
    - name: Compiler Cache Fixup
      run: |
        mkdir -p /home/runner/.ccache

    - name: "CCache: Restore saved cache"
      uses: actions/cache@v6
      with:
        path: /home/runner/.ccache
        key: ccache-micropython-explorer-picovector-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ccache-micropython-explorer-picovector-${{ github.ref }}
          ccache-micropython-explorer-picovector-

    - name: "Checkout Project"
      uses: actions/checkout@v7
      with:
        submodules: true
        path: ${{ env.CI_PROJECT_ROOT }}

    - name: "Prepare All: Generate cache key"
      shell: bash
      run: |
        echo "CI_CACHE_KEY=`shasum "$CI_PROJECT_ROOT/ci/picovector.sh" | cut -d " " -f 1`" >> $GITHUB_ENV

    - name: "Prepare All: Restore saved cache"
      id: cache-prepare-all
      uses: actions/cache@v6
      with:
        path: |
          ${{ env.CI_BUILD_ROOT }}/micropython
          ${{ env.CI_BUILD_ROOT }}/pimoroni-pico
          ${{ env.CI_BUILD_ROOT }}/picovector-micropython
          ${{ env.CI_BUILD_ROOT }}/tools
        key: prepare-all-${{ env.CI_CACHE_KEY }}

    - name: "Install Arm GNU Toolchain (arm-none-eabi-gcc)"
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '13.3.Rel1'

    - name: "Prepare All: Install dependencies"
      if: steps.cache-prepare-all.outputs.cache-hit == 'true'
      shell: bash
      run: |
        source $CI_PROJECT_ROOT/ci/picovector.sh
        ci_install_build_deps
        ci_python_prepare

    - name: "Prepare All: Prepare tools & dependencies"
      if: steps.cache-prepare-all.outputs.cache-hit != 'true'
      shell: bash
      run: |
        source $CI_PROJECT_ROOT/ci/picovector.sh
        ci_install_build_deps
        ci_prepare_all
        ci_python_prepare

    - name: "MicroPython: Configure"
      shell: bash
      run: |
        source $CI_PROJECT_ROOT/ci/picovector.sh
        micropython_version
        ci_cmake_configure

    - name: "MicroPython: Build"
      shell: bash
      run: |
        source $CI_PROJECT_ROOT/ci/picovector.sh
        ci_cmake_build

    - name: "Artifacts: Upload .uf2"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.CI_RELEASE_FILENAME }}.uf2
        path: ${{ env.CI_BUILD_ROOT }}/${{ env.CI_RELEASE_FILENAME }}.uf2

    - name: "Artifacts: Upload .uf2 (With Filesystem)"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.CI_RELEASE_FILENAME }}-with-filesystem.uf2
        path: ${{ env.CI_BUILD_ROOT }}/${{ env.CI_RELEASE_FILENAME }}-with-filesystem.uf2

    - name: "Release: Upload .uf2"
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ env.CI_BUILD_ROOT }}/${{ env.CI_RELEASE_FILENAME }}.uf2

    - name: "Release: Upload .uf2 (With Filesystem)"
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ env.CI_BUILD_ROOT }}/${{ env.CI_RELEASE_FILENAME }}-with-filesystem.uf2
